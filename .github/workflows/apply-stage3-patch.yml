name: Apply Stage 3 Patch

on:
  push:
    branches: [main]
    paths:
      - '.automation/stage3_patch.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic source transformation
        run: |
          python3 .automation/stage3_patch.py
          rm .automation/stage3_patch.py
          rm .github/workflows/apply-stage3-patch.yml
      - name: Commit patch result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "implement Vulkan selection outline"
          git push origin HEAD:main
