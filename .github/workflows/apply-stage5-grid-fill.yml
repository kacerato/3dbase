name: Apply Stage 5 Grid Fill
on:
  push:
    branches: [main]
    paths: ['.automation/stage5_grid_fill_*']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Apply grid fill core
        run: python3 .automation/stage5_grid_fill_core.py
      - name: Apply grid fill editor roadmap
        run: python3 .automation/stage5_grid_fill_editor.py
      - name: Install Vulkan host development runtime
        run: sudo apt-get update && sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers
      - name: Install Qt 6.8 and Shader Tools
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtshadertools'
          cache: true
      - name: Configure strict full build
        run: cmake -S . -B /tmp/mobile3d-stage5-grid-fill -G Ninja -DMOBILE3D_BUILD_TESTS=ON -DMOBILE3D_BUILD_QT_APP=ON -DMOBILE3D_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build /tmp/mobile3d-stage5-grid-fill --parallel
      - name: Test
        run: ctest --test-dir /tmp/mobile3d-stage5-grid-fill --output-on-failure
      - name: QML static analysis
        run: cmake --build /tmp/mobile3d-stage5-grid-fill --target mobile3d_studio_qmllint
      - name: Commit validated product code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests docs
          git diff --cached --check
          git commit -m "add structured grid fill with span and offset"
          git push origin HEAD:main
