name: Apply Stage 5 Edit Mode UI
on:
  push:
    branches: [main]
    paths: ['.automation/stage5_edit_mode_ui.py']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Apply edit mode snapshot and UI
        run: python3 .automation/stage5_edit_mode_ui.py
      - name: Configure strict Core Editor build
        run: cmake -S . -B /tmp/mobile3d-stage5-edit-ui -G Ninja -DMOBILE3D_BUILD_TESTS=ON -DMOBILE3D_BUILD_QT_APP=OFF -DMOBILE3D_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build /tmp/mobile3d-stage5-edit-ui --parallel
      - name: Test
        run: ctest --test-dir /tmp/mobile3d-stage5-edit-ui --output-on-failure
      - name: Commit validated product code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git diff --cached --check
          git commit -m "expose edit mode snapshot and modeling controls"
          git push origin HEAD:main
