name: Apply Stage 4 Visibility Lock
on:
  push:
    branches: [main]
    paths: ['.automation/stage4_visibility_lock.py']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: |
          python3 .automation/stage4_visibility_lock.py
          rm .automation/stage4_visibility_lock.py
          rm .github/workflows/apply-stage4-visibility-lock.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "add visibility and edit locking"
          git push origin HEAD:main
