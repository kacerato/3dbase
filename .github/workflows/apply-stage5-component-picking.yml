name: Apply Stage 5 Component Picking
on:
  push:
    branches: [main]
    paths: ['.automation/stage5_component_picker_core.py', '.automation/stage5_component_picker_qt.py']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Apply picker core
        run: python3 .automation/stage5_component_picker_core.py
      - name: Apply Qt viewport integration
        run: python3 .automation/stage5_component_picker_qt.py
      - name: Install Vulkan host development runtime
        run: sudo apt-get update && sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers
      - name: Install Qt 6.8 and Shader Tools
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtshadertools'
          cache: true
      - name: Configure strict full build
        run: cmake -S . -B /tmp/mobile3d-stage5-picker -G Ninja -DMOBILE3D_BUILD_TESTS=ON -DMOBILE3D_BUILD_QT_APP=ON -DMOBILE3D_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build /tmp/mobile3d-stage5-picker --parallel
      - name: Test
        run: ctest --test-dir /tmp/mobile3d-stage5-picker --output-on-failure
      - name: Commit validated product code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git diff --cached --check
          git commit -m "add depth aware edit mode component picking"
          git push origin HEAD:main
