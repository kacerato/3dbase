name: Apply Stage 5 Vulkan Edit Overlay
on:
  push:
    branches: [main]
    paths: ['.automation/stage5_vulkan_edit_overlay.py']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Apply Vulkan edit overlay
        run: python3 .automation/stage5_vulkan_edit_overlay.py
      - name: Install Vulkan host development runtime
        run: sudo apt-get update && sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers
      - name: Install Qt 6.8 and Shader Tools
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtshadertools'
          cache: true
      - name: Configure Qt Vulkan build
        run: cmake -S . -B /tmp/mobile3d-stage5-overlay -G Ninja -DMOBILE3D_BUILD_TESTS=ON -DMOBILE3D_BUILD_QT_APP=ON -DMOBILE3D_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build /tmp/mobile3d-stage5-overlay --parallel
      - name: Test
        run: ctest --test-dir /tmp/mobile3d-stage5-overlay --output-on-failure
      - name: Commit validated product code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git diff --cached --check
          git commit -m "render edit mode topology overlay in Vulkan"
          git push origin HEAD:main
