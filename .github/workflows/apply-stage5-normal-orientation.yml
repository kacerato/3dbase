name: Apply Stage 5 Normal Orientation
on:
  push:
    branches: [main]
    paths: ['.automation/stage5_normals_*']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Apply normals core
        run: python3 .automation/stage5_normals_core.py
      - name: Apply normals editor UI roadmap
        run: python3 .automation/stage5_normals_editor.py
      - name: Fix normal no-op dirty checkpoint test
        run: python3 .automation/stage5_normals_test_fix.py
      - name: Install Vulkan host development runtime
        run: sudo apt-get update && sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers
      - name: Install Qt 6.8 and Shader Tools
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtshadertools'
          cache: true
      - name: Configure strict full build
        run: cmake -S . -B /tmp/mobile3d-stage5-normals -G Ninja -DMOBILE3D_BUILD_TESTS=ON -DMOBILE3D_BUILD_QT_APP=ON -DMOBILE3D_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build /tmp/mobile3d-stage5-normals --parallel
      - name: Test
        run: ctest --test-dir /tmp/mobile3d-stage5-normals --output-on-failure
      - name: QML static analysis
        run: cmake --build /tmp/mobile3d-stage5-normals --target mobile3d_studio_qmllint
      - name: Commit validated product code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests docs
          git diff --cached --check
          git commit -m "add topology normal orientation tools"
          git push origin HEAD:main
