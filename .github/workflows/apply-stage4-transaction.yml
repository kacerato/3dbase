name: Apply Stage 4 Transaction
on:
  push:
    branches: [main]
    paths: ['.automation/stage4_transaction.py']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: |
          python3 .automation/stage4_transaction.py
          rm .automation/stage4_transaction.py
          rm .github/workflows/apply-stage4-transaction.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "add atomic transform transactions"
          git push origin HEAD:main
